no_auto_install: true

pre-commit:
  parallel: true
  commands:
    markuplint:
      glob:
        - 'src/**/*.{html,jsx,tsx}'
      run: pnpm exec markuplint {staged_files} --fix --problem-only
      stage_fixed: true
    oxfmt:
      glob:
        - '*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,md,mdx,yml,yaml}'
      exclude:
        - pnpm-lock.yaml
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    oxlint:
      glob:
        - '*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
